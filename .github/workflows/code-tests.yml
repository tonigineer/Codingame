name: Code tests

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - ".github/workflows/code-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace
