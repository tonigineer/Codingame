name: tools

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"

jobs:
  ruff:
    name: ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "tools/uv.lock"

      # ruff is a locked dev dependency (tools/pyproject.toml), so the
      # version here always matches what `uv run ruff` uses locally.
      - name: Lint (ruff check)
        run: uv run --project tools ruff check tools/

      - name: Format (ruff format --check)
        run: uv run --project tools ruff format --check tools/
