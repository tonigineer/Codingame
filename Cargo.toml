[workspace]
members = [
    "common",
    "games/connect-four",
    "games/tic-tac-toe",
    "bots/snakebyte",
    "bots/trollfarm",
    "bots/ultimate-tic-tac-toe",
    "puzzles/one-billion-rows",
]
resolver = "3"

[workspace.dependencies]
itertools = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = true
